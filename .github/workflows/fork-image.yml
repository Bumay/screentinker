# Builds this fork's Docker image and publishes it to GitHub Container Registry as
#   ghcr.io/<owner>/screentinker:latest   (every push to main)
#   ghcr.io/<owner>/screentinker:<sha>    (every push to main, for pinning / rollback)
#   ghcr.io/<owner>/screentinker:vX.Y.Z   (when a v* tag is pushed)
#
# Runs only in a fork: upstream (screentinker/screentinker) publishes through release.yml.
# No secrets to set up — GITHUB_TOKEN may push to the repo owner's own ghcr namespace.
name: Fork image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository_owner != 'screentinker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr needs lowercase)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/screentinker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
